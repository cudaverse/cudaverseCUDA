name: source-repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Build source repository
        shell: Rscript {0}
        run: |
          dir.create("public/src/contrib", recursive = TRUE)
          system2(file.path(R.home("bin"), "R"), c("CMD", "build", "."))
          file.copy(list.files(pattern = "^cudaverseCUDA_.*[.]tar[.]gz$", full.names = TRUE),
                    "public/src/contrib")
          tools::write_PACKAGES("public/src/contrib", type = "source")
          writeLines("cudaverseCUDA source repository", "public/index.html")
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
